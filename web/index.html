<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#111111" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Boardhang" />
    <title>Boardhang</title>
    <meta
      name="description"
      content="Build a problem on the grid and light it on your DIY MoonBoard LEDs over Web Bluetooth."
    />
    <!-- Link previews only — every www response is noindexed (X-Robots-Tag), so
         these OG tags exist for shares/DMs, not search. og:image must be an
         absolute URL. -->
    <meta property="og:title" content="Boardhang" />
    <meta
      property="og:description"
      content="Build a problem on the grid and light it on your DIY MoonBoard LEDs over Web Bluetooth."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.boardhang.app/" />
    <meta property="og:image" content="https://www.boardhang.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Pre-paint theme: set `.dark` + theme-color BEFORE the bundle loads, so a
         saved Light/Dark/System preference never flashes the wrong theme on a cold
         load. Runs after the theme-color meta above so it can rewrite it. Duplicates
         the resolve logic in src/shell/themeStore.ts (the bundle isn't available
         yet) — keep the two in sync. -->
    <script>
      ;(function () {
        try {
          var pref = localStorage.getItem('theme')
          var dark =
            pref === 'dark' ||
            ((pref === null || pref === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#111111' : '#ffffff')
        } catch (e) {
          /* localStorage/matchMedia can throw in restricted embedders; default light. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- The app is client-rendered, so this is the only markup an agent that does not
         execute JavaScript ever sees — which is every AI crawler. It carries the one
         link off this origin, to the indexable content site on the apex, so the link
         graph is not one-way into a noindexed host. Inline styles on purpose: without
         JS the bundle never loads, so no stylesheet applies. -->
    <noscript>
      <p style="max-width: 34rem; margin: 0 auto; padding: 2rem 1.5rem; font-family: system-ui, sans-serif; line-height: 1.6">
        Boardhang needs JavaScript to run. For guides, and for what Boardhang is and who
        builds it, visit <a href="https://boardhang.app">boardhang.app</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
